name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Node ${{ matrix.node }}
    strategy:
      matrix:
        node: ['22.13.0', '24']
    uses: ./.github/workflows/verify.yml
    with:
      node-version: ${{ matrix.node }}

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$asset" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${asset}"
          echo "${ACTIONLINT_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" actionlint
          ./actionlint -version
      - name: Lint GitHub Actions workflows
        run: ./actionlint -color
